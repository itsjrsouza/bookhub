name: BookHub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Rodar lint (shell + micro-catalogo + micro-estante)
        run: npm run lint

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes (Vitest)
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build (micro-catalogo + micro-estante + shell + diário)
        run: npm run build
      - name: Guardar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: bookhub-dist
          path: apps/shell/dist

  deploy:
    name: Deploy (Vercel)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # amondnet/vercel-action@v25 instala uma versão fixa e antiga do
      # Vercel CLI (25.1.0), que a API da Vercel já não aceita mais
      # ("Your Vercel CLI version is outdated..."). Usando `npm install
      # -g vercel@latest` diretamente (o jeito que a própria Vercel
      # documenta para CI) sempre pega a versão atual, sem depender de
      # uma action de terceiros desatualizada.
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Puxar configuração do ambiente Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build com a Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy para produção
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
